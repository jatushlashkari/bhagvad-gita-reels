name: refresh-instagram-token
on:
  schedule:
    - cron: '0 3 * * 0' # weekly, Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Refresh long-lived token and store it back
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(npx tsx -e "import('./post/instagram.ts').then(m => m.refreshIgToken(process.env.IG_ACCESS_TOKEN)).then(r => process.stdout.write(r.token)).catch(e => { console.error(e.message); process.exit(1); })")
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW"
          echo "token refreshed and stored"
