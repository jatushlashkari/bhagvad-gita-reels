name: publisher
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render + schedule only — publish nothing'
        type: boolean
        default: false

concurrency:
  group: publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # arm64 runner: 4 cores / 16 GB (free for public repos) — the 2-core x64 runner's
    # render tab died of resource exhaustion late in every full-length render.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install edge-tts
        run: pip install edge-tts
      - uses: actions/cache@v4
        with:
          path: |
            public/assets/backgrounds
            public/assets/music
          key: assets-${{ hashFiles('public/assets/manifest.json') }}
      - run: npm ci
      - name: Fetch + normalize assets (cached after first run)
        run: npm run assets
      - run: npx remotion browser ensure
      - name: Auto-fill + publish due
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          REMOTION_CONCURRENCY: '2'
        run: |
          FLAGS=""
          [ "$DRY_RUN" = "true" ] && FLAGS="--dry-run"
          npx tsx pipeline/publisher.ts $FLAGS
      - name: Save reel artifact (always — manual-posting fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
          if-no-files-found: ignore
      - name: Commit calendar state (always — protects against double-posts after partial failure)
        if: always()
        run: |
          git config user.name 'gita-reels-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add schedule.json state.json public/thumbs
          git diff --cached --quiet || git commit -m "chore: calendar run [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
