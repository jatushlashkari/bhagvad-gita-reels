name: daily-reel
on:
  schedule:
    - cron: '30 1 * * *' # 07:00 IST
  workflow_dispatch:
    inputs:
      verse:
        description: 'Override ref, e.g. gita:2:47'
        required: false
      dry_run:
        description: 'Render only — post nothing (no secrets needed)'
        type: boolean
        default: false

concurrency:
  group: daily-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    # arm64 runner: 4 cores / 16 GB (free for public repos) — the 2-core x64 runner's
    # render tab died of resource exhaustion late in every full-length render.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install edge-tts
        run: pip install edge-tts
      - uses: actions/cache@v4
        with:
          path: |
            public/assets/backgrounds
            public/assets/music
          key: assets-${{ hashFiles('public/assets/manifest.json') }}
      - run: npm ci
      - name: Fetch + normalize assets (cached after first run)
        run: npm run assets
      - run: npx remotion browser ensure
      - id: mode
        run: echo "mode=$(node -p "require('./config.json').mode || 'daily'")" >> "$GITHUB_OUTPUT"
      - name: Generate and post
        if: steps.mode.outputs.mode != 'calendar'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSE_OVERRIDE: ${{ inputs.verse }}
          DRY_RUN: ${{ inputs.dry_run }}
          REMOTION_CONCURRENCY: '2'
          REMOTION_VERBOSE: '1' # extra render diagnostics in CI logs
        run: |
          FLAGS=""
          [ "$DRY_RUN" = "true" ] && FLAGS="--dry-run"
          if [ -n "$VERSE_OVERRIDE" ]; then
            npm run generate -- --verse "$VERSE_OVERRIDE" $FLAGS
          else
            npm run generate -- $FLAGS
          fi
      - name: Skip (calendar mode)
        if: steps.mode.outputs.mode == 'calendar'
        run: echo "calendar mode — daily-reel is idle; publisher.yml owns posting"
      - name: Save reel artifact (always — manual-posting fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
          if-no-files-found: ignore
      - name: Commit state (always — protects against double-posts after partial failure)
        if: always()
        run: |
          git config user.name 'gita-reels-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m "chore: record posted reel [skip ci]"
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
