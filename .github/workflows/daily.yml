name: daily-reel
on:
  schedule:
    - cron: '30 1 * * *' # 07:00 IST
  workflow_dispatch:
    inputs:
      verse:
        description: 'Override ref, e.g. gita:2:47'
        required: false

concurrency:
  group: daily-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install edge-tts and emoji font
        run: |
          pip install edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji
      - uses: actions/cache@v4
        with:
          path: |
            public/assets/backgrounds
            public/assets/music
          key: assets-${{ hashFiles('public/assets/manifest.json') }}
      - run: npm ci
      - name: Fetch + normalize assets (cached after first run)
        run: npm run assets
      - run: npx remotion browser ensure
      - name: Generate and post
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSE_OVERRIDE: ${{ inputs.verse }}
        run: |
          if [ -n "$VERSE_OVERRIDE" ]; then
            npm run generate -- --verse "$VERSE_OVERRIDE"
          else
            npm run generate
          fi
      - name: Save reel artifact (always — manual-posting fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
          if-no-files-found: ignore
      - name: Commit state (always — protects against double-posts after partial failure)
        if: always()
        run: |
          git config user.name 'gita-reels-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m "chore: record posted reel [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
